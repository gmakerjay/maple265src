# ==============================================================================
#  SERVERGAMEOFFLINE-FACEBOOK PAGE
#  MapleStory v265 / v263 Portable Server Configuration
# ==============================================================================

# ===== 1. Database Connection (Zero-Install Portable MariaDB) =====
# Default high-range port to avoid collision with MySQL 3306
db.port=33066
db.backupPort=33076
db.url=jdbc:mariadb://127.0.0.1:33066/vietmaple?allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Bangkok
db.username=root
db.password=root

# ===== 2. Network & Ports =====
# 127.0.0.1 for solo offline play. Change to LAN IPv4 or Radmin/Hamachi IP for multiplayer.
server.ip=127.0.0.1
server.loginPort=8484
server.apiPort=8483

# ===== 3. Server Branding =====
server.name=MapleStory V265
server.eventMsg=Welcome to MapleStory! [SERVERGAMEOFFLINE-FACEBOOK PAGE]

# ===== 4. Server Rates (Adjustable here without recompiling) =====
# Item Drop Rate Multiplier (Default: 20 -> 20x Drop Rate)
# You can change this number (e.g. 10, 20, 50, 100) and restart server.
server.dropRate=20

# General EXP Rate Multiplier (Default: 100 -> 100x EXP)
server.expRate=100

# EXP Rate for characters below level 100
server.expRateBelow100=100

# EXP Rate for characters level 101 to 210
server.expRate101to210=500

# Quest EXP Rate Multiplier
server.questExpRate=1

# Meso Drop Rate Multiplier (Default: 100 -> 100x Meso)
server.mesoRate=100

# ===== 5. GM & Administration =====
# Admin Only Login (true = Only GM characters can log in, false = All players allowed)
server.adminLoginOnly=false

# System logging
server.debugMode=false
server.packetLog=false
server.ipLog=false
server.sqlDebug=false
server.autoEvent=false
