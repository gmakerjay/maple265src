# ==============================================================================
#  MapleStory v265 Portable Server Configuration
#  แก้ไขไฟล์นี้เพื่อปรับแต่งการตั้งค่าเซิร์ฟเวอร์ โดยไม่ต้อง Rebuild ซอร์สโค้ดใหม่
# ==============================================================================

# ===== 1. การเชื่อมต่อฐานข้อมูล (Database Configuration) =====
# โหมด Portable: MariaDB ทำงานภายในเครื่องผ่านพอร์ต 3306 
# ฐานข้อมูลจะบันทึกและเซฟข้อมูลตัวละคร/ไอเทมลงใน mariadb\data\ ตลอดเวลา
db.url=jdbc:mariadb://127.0.0.1:3306/vietmaple?allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Bangkok
db.username=root
db.password=root

# ===== 2. IP และ พอร์ตเครือข่าย (Network Settings) =====
# - เล่นคนเดียวในเครื่อง (Localhost): 127.0.0.1
# - เล่นกับเพื่อนผ่าน LAN / Radmin VPN / Hamachi / VPS: ใส่ IPv4 ของเครื่องโฮสต์
server.ip=127.0.0.1
server.loginPort=8484
server.apiPort=8483

# ===== 3. ข้อมูลเซิร์ฟเวอร์ (Server Info) =====
server.name=MapleStory V265
server.eventMsg=Welcome to MapleStory V265 Portable Server!

# ===== 4. อัตราคูณเซิร์ฟเวอร์ (Server Rates) =====
# อัตราคูณ EXP ทั่วไป
server.expRate=100
# อัตราคูณ EXP สำหรับเลเวลต่ำกว่า 100
server.expRateBelow100=100
# อัตราคูณ EXP สำหรับเลเวล 101 ถึง 210
server.expRate101to210=500
# อัตราคูณ EXP เควส
server.questExpRate=1
# อัตราคูณเงิน Meso (เงินดรอปจากมอนสเตอร์)
server.mesoRate=100
# อัตราดรอปไอเทม (Item Drop Rate)
server.dropRate=20

# ===== 5. ระบบความปลอดภัยและดีบั๊ก (System & Debug Settings) =====
# อนุญาตเฉพาะแอดมินล็อกอิน (true = เปิดเฉพาะ GM, false = ผู้เล่นทั่วไปเข้าได้)
server.adminLoginOnly=false
# โหมดดีบั๊ก (แสดงข้อมูลรายละเอียดการทำงาน)
server.debugMode=false
# บันทึก Packet Log (true / false)
server.packetLog=false
# บันทึก IP Log (true / false)
server.ipLog=false
# แสดงคำสั่ง SQL ใน Console
server.sqlDebug=false
# เปิดระบบ Auto Event อัตโนมัติ
server.autoEvent=false
