# ==============================================================================
#  MapleStory v265.3 Localhost Launcher Configuration
# ==============================================================================

[Server]
# Server IP (Localhost = 127.0.0.1, LAN / VPN = Remote IP)
IP=127.0.0.1

# Login Port (Default = 8484)
Port=8484

# Server API Port for account auth token (Default = 8483)
ApiPort=8483

# Check if server is running before launching client (1 = Enable, 0 = Disable)
CheckServer=1

[Client]
# Game executable file name
Exe=MapleStory.exe

# Hook DLL file name
Dll=Localhost.dll

# Custom launch arguments (Leave empty to let Launcher auto-authenticate or use UserID)
Args=

[Account]
# AutoLogin via Server API Port 8483:
# 1 = Requests official session token from server API (Recommended)
# 0 = Direct User ID bypass (WebStart <UserID>)
AutoLogin=1

# Account credentials (Database: users table)
Username=admin
Password=admin

# Fallback User ID in database (1 = admin, 2 = admin1, 3 = asura, 4 = maigal)
UserID=1
